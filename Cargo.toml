[package]
name = "shiguredo_video_toolbox"
version = "2026.2.0-canary.1"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for Apple Video Toolbox hardware video encoders and decoders"
readme = "README.md"
homepage = "https://github.com/shiguredo/video-toolbox-rs"
repository = "https://github.com/shiguredo/video-toolbox-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**"]

[dependencies]
# コールバック内などで呼び出し元へエラーを返せない箇所のエラーログ用
tracing = "0.1"

[dev-dependencies]
# テストフィクスチャ用の 2D ベクターグラフィックスライブラリ
raden = "2026.1"
# VP9 ラウンドトリップテストでカラーバーをエンコードするために使用
shiguredo_libvpx = "2026.1"
# サンプル / テストで MP4 を扱うために使用
shiguredo_mp4 = "2026.3"

[build-dependencies]
# Video Toolbox の C API から Rust バインディングを生成するために使用
bindgen = "0.72"
